[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonoma"
version = "0.1.0"
description = "Autonomous AI Task Worker prototype with dynamic planning, tool execution, self-verification, and HITL safety"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
    "rich>=13.7.0",
    "reportlab>=4.1.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
autonoma = "autonoma.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autonoma*"]
exclude = ["data*", "tests*"]
